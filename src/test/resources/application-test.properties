# ============================================
# TEST DATABASE CONFIGURATION (H2 In-Memory)
# ============================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ============================================
# AWS S3 CONFIGURATION (Mocked for tests)
# ============================================
cloud.aws.s3.bucket=test-bucket
cloud.aws.region=us-east-1
cloud.aws.credentials.access-key=test-access-key
cloud.aws.credentials.secret-key=test-secret-key

# ============================================
# DOCUMENT PROCESSING CONFIGURATION
# ============================================
document.processing.max-time-seconds=10
document.processing.max-retries=1

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.com.legalcase=DEBUG
logging.level.org.springframework.test=WARN
logging.level.org.hibernate=WARN

# ============================================
# JWT CONFIGURATION (for tests)
# ============================================
