# ===============================================
# SERVER CONFIGURATION
# ===============================================
server.port=8080
server.servlet.context-path=/api

# ===============================================
# POSTGRESQL DATABASE CONFIGURATION
# ===============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/legalcase_db
spring.datasource.username=legalcase_user
spring.datasource.password=legalcase_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================================
# JPA / HIBERNATE
# ===============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================================
# JWT CONFIGURATION
# ===============================================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration=86400000

# AWS S3 Configuration
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
# ============================================
# AWS S3 CONFIGURATION - CORRECT REGION
# ============================================
cloud.aws.region=eu-north-1
cloud.aws.s3.bucket=legalcase-documents-dev-525391386162-eu-north-1-an

# Document Processing Configuration
document.processing.max-time-seconds=300
document.processing.max-retries=3

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===============================================
# LOGGING (for debugging)
# ===============================================
logging.level.com.legalcase=DEBUG
logging.level.org.springframework.security=DEBUG

# ============================================
# GEMINI 2.5 FLASH CONFIGURATION
# ============================================

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY}

# Use Gemini 2.5 Pro (stable GA version) - June 2025 release
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

gemini.api.stream-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:streamGenerateContent

# ============================================
# SPRINGDOC OPENAPI (SWAGGER) CONFIGURATION
# ============================================

# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# API docs path
springdoc.api-docs.path=/v3/api-docs

# Packages to scan
springdoc.packages-to-scan=com.legalcase.controller

# Paths to include
springdoc.paths-to-match=/api/**,/auth/**,/cases/**,/tasks/**,/documents/**,/ai/**,/chat/**,/notifications/**,/comments/**,/admin/**,/users/**

# Sort tags and operations alphabetically
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

# Try-it-out functionality enabled
springdoc.swagger-ui.tryItOutEnabled=true

# Display request duration
springdoc.swagger-ui.displayRequestDuration=true

