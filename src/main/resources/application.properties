# ===============================================
# SERVER CONFIGURATION
# ===============================================
server.port=8080
server.servlet.context-path=/api

# ===============================================
# DATABASE CONFIGURATION (uses environment variables)
# ===============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:legalcase_db}
spring.datasource.username=${DB_USER:legalcase_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================================
# JPA / HIBERNATE
# ===============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================================
# JWT CONFIGURATION (uses environment variable)
# ===============================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================================
# AWS S3 CONFIGURATION
# ===============================================
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region=${AWS_REGION:eu-north-1}
cloud.aws.s3.bucket=${S3_BUCKET}

# ===============================================
# DOCUMENT PROCESSING
# ===============================================
document.processing.max-time-seconds=${DOC_PROCESSING_TIMEOUT:300}
document.processing.max-retries=${DOC_PROCESSING_RETRIES:3}

# ===============================================
# FILE UPLOAD
# ===============================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===============================================
# LOGGING
# ===============================================
logging.level.com.legalcase=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# ===============================================
# GEMINI AI CONFIGURATION
# ===============================================
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
gemini.api.stream-url=${GEMINI_STREAM_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:streamGenerateContent}

# ===============================================
# SPRINGDOC OPENAPI (SWAGGER)
# ===============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.legalcase.controller
springdoc.paths-to-match=/api/**,/auth/**,/cases/**,/tasks/**,/documents/**,/ai/**,/chat/**,/notifications/**,/comments/**,/admin/**,/users/**,/user/**
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true