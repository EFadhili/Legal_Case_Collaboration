# ===============================================
# SERVER CONFIGURATION
# ===============================================
server.port=8080
server.servlet.context-path=/api

# ===============================================
# POSTGRESQL DATABASE CONFIGURATION
# ===============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/legalcase_db
spring.datasource.username=legalcase_user
spring.datasource.password=legalcase_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================================
# JPA / HIBERNATE
# ===============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================================
# JWT CONFIGURATION
# ===============================================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration=86400000

# AWS S3 Configuration
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region=us-east-1
cloud.aws.s3.bucket=legalcase-documents

# Document Processing Configuration
document.processing.max-time-seconds=300
document.processing.max-retries=3

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===============================================
# LOGGING (for debugging)
# ===============================================
logging.level.com.legalcase=DEBUG
logging.level.org.springframework.security=DEBUG

